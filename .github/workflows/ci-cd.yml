name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dental_clinic
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Build Backend
        run: mvn clean compile -DskipTests
        
      - name: Run Backend Tests
        run: mvn test
        env:
          DB_URL: jdbc:mysql://localhost:3306/dental_clinic
          DB_USERNAME: root
          DB_PASSWORD: root
          
      - name: Generate Test Report
        run: mvn surefire-report:report
      
      - name: Upload Test Reports
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: target/surefire-reports/
          
      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
          
      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test
          
      - name: SonarCloud Analysis
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar -Dsonar.projectKey=dental-clinic -Dsonar.organization=myorg
        
      - name: Package Application
        run: mvn package -DskipTests
        
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: application-jar
          path: target/*.jar

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/dental-clinic:latest
            ${{ secrets.DOCKER_USERNAME }}/dental-clinic:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: docker-build
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy to Staging
        run: |
          echo "Deploying to Staging Environment..."
          # Add deployment script (Heroku/AWS/self-hosted)
          docker pull ${{ secrets.DOCKER_USERNAME }}/dental-clinic:latest
          docker run -d -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/dental-clinic:latest
          
      - name: Smoke Tests
        run: |
          curl -f http://localhost:8080/api/health || exit 1
          echo "Smoke tests passed!"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy to Production
        run: |
          echo "Deploying to Production Environment..."
          # Production deployment script
          curl -X POST -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
               https://api.your-deployment-service.com/deploy
